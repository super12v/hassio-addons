name: Build and Publish

on:
  push:
    tags:
      - 'patroni-raft/v*'
      - 'proxmox-qdevice/v*'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.parse.outputs.addon }}
      version: ${{ steps.parse.outputs.version }}
      image_name: ${{ steps.parse.outputs.image_name }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          ADDON="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "addon=${ADDON}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [ "${ADDON}" = "patroni-raft" ]; then
            echo "image_name=patroni-raft-voter" >> $GITHUB_OUTPUT
          elif [ "${ADDON}" = "proxmox-qdevice" ]; then
            echo "image_name=proxmox-qdevice" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch: [aarch64, amd64]
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine base image
        id: base
        run: |
          ADDON="${{ needs.detect.outputs.addon }}"
          ARCH="${{ matrix.arch }}"
          BASE=$(grep "${ARCH}:" "${ADDON}/build.yaml" | awk '{print $2}')
          echo "image=${BASE}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ needs.detect.outputs.addon }}
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.image_name }}/${{ matrix.arch }}:${{ needs.detect.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.image_name }}/${{ matrix.arch }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
