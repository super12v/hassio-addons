name: "MariaDB Arbiter"
description: "Keepalived health arbitrator for MariaDB HA. Provides an HTTP endpoint that determines which node should hold the VIP."
version: "1.0.0"
slug: "mariadb_arbiter"
url: "https://github.com/super12v/hassio-addons"
image: "ghcr.io/super12v/hassio-addons/mariadb-arbiter/{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: system
boot: auto
host_network: true
map:
  - addon_config:rw
stage: experimental
options:
  mariadb_primary_host: "192.168.1.10"
  mariadb_standby_host: "192.168.1.11"
  mariadb_port: 3306
  health_port: 8306
  check_interval: 2
  log_level: "INFO"
schema:
  mariadb_primary_host: str
  mariadb_standby_host: str
  mariadb_port: port
  health_port: port
  check_interval: "int(1,30)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
