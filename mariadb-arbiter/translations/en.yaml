configuration:
  mariadb_primary_host:
    name: MariaDB Primary Host
    description: >-
      IP address of the MariaDB primary server.
  mariadb_standby_host:
    name: MariaDB Standby Host
    description: >-
      IP address of the MariaDB standby (replica) server.
  mariadb_port:
    name: MariaDB Port
    description: >-
      Port for MariaDB on both nodes. Default: 3306.
  health_port:
    name: Health Endpoint Port
    description: >-
      Port for the arbiter HTTP endpoint. Keepalived on both
      MariaDB CTs queries this to determine the true primary.
      Default: 8306.
  check_interval:
    name: Check Interval (seconds)
    description: >-
      How often to check MariaDB node health. Default: 2.
  log_level:
    name: Log Level
    description: >-
      Logging verbosity. DEBUG, INFO, WARNING, or ERROR.
