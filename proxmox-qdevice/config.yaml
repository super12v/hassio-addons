name: "Proxmox QDevice"
description: "Corosync QNetd service providing a third quorum vote for 2-node Proxmox VE clusters. Enables automatic HA failover when a node goes down."
version: "1.1.0"
slug: "proxmox_qdevice"
url: "https://github.com/super12v/hassio-addons"
image: "ghcr.io/super12v/proxmox-qdevice/{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: system
boot: auto
host_network: true
map:
  - addon_config:rw
  - ssl:ro
stage: experimental
ports:
  "2222/tcp": null
  "5403/tcp": null
ports_description:
  "2222/tcp": "SSH (setup handshake)"
  "5403/tcp": "Corosync QNetd"
options:
  authorized_keys:
    - ""
  ssh_port: 2222
  qnetd_port: 5403
  log_level: "INFO"
schema:
  authorized_keys:
    - str
  ssh_port: port
  qnetd_port: port
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
