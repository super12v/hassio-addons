name: "Database Quorum"
description: "Redis Sentinel + MariaDB keepalived arbitrator. Provides tiebreaker votes for database HA failover."
version: "1.0.0"
slug: "db_quorum"
url: "https://github.com/super12v/hassio-addons"
image: "ghcr.io/super12v/hassio-addons/db-quorum/{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: system
boot: auto
host_network: true
map:
  - addon_config:rw
stage: experimental
options:
  redis_primary_host: "192.168.1.10"
  redis_primary_port: 6379
  redis_sentinel_port: 26379
  redis_quorum: 2
  redis_down_after_ms: 5000
  redis_failover_timeout: 30000
  mariadb_primary_host: "192.168.1.10"
  mariadb_standby_host: "192.168.1.11"
  mariadb_port: 3306
  mariadb_health_port: 8306
  log_level: "INFO"
schema:
  redis_primary_host: str
  redis_primary_port: port
  redis_sentinel_port: port
  redis_quorum: "int(1,5)"
  redis_down_after_ms: "int(1000,60000)"
  redis_failover_timeout: "int(5000,300000)"
  mariadb_primary_host: str
  mariadb_standby_host: str
  mariadb_port: port
  mariadb_health_port: port
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
